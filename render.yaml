x-app-env: &app-env
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: "false"
  - key: APP_LOG_LEVEL
    value: error
  - key: APP_URL
    value: https://joyinzoe.org
  - key: APP_KEY
    sync: false
  - key: ADMIN_NAME
    sync: false
  - key: ADMIN_EMAIL
    sync: false
  - key: ADMIN_PASSWORD
    sync: false
  - key: DB_CONNECTION
    value: pgsql
  - key: DB_HOST
    fromDatabase:
      name: joy-in-zoe-postgres
      property: host
  - key: DB_PORT
    fromDatabase:
      name: joy-in-zoe-postgres
      property: port
  - key: DB_DATABASE
    fromDatabase:
      name: joy-in-zoe-postgres
      property: database
  - key: DB_USERNAME
    fromDatabase:
      name: joy-in-zoe-postgres
      property: user
  - key: DB_PASSWORD
    fromDatabase:
      name: joy-in-zoe-postgres
      property: password
  - key: SESSION_DRIVER
    value: database
  - key: CACHE_STORE
    value: database
  - key: QUEUE_CONNECTION
    value: database
  - key: SESSION_SECURE_COOKIE
    value: "true"

services:
  - type: web
    name: joy-in-zoe
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars: *app-env

  - type: worker
    name: joy-in-zoe-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars: *app-env

databases:
  - name: joy-in-zoe-postgres
    plan: free