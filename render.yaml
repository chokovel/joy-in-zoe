services:
  - type: web
    name: joy-in-zoe
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    initialDeployHook: ./docker/render_seed.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://joyinzoe.org
      - key: APP_KEY
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: joy-in-zoe-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: joy-in-zoe-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: joy-in-zoe-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: joy-in-zoe-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: joy-in-zoe-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"

  - type: worker
    name: joy-in-zoe-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://joyinzoe.org
      - key: APP_KEY
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: joy-in-zoe-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: joy-in-zoe-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: joy-in-zoe-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: joy-in-zoe-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: joy-in-zoe-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"

databases:
  - name: joy-in-zoe-postgres
    plan: free